<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>WeatherApp</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        input { padding: 8px; font-size: 16px; width: 300px; }
        button { padding: 8px 16px; font-size: 16px; cursor: pointer; }
        .provider-card { border: 1px solid #ccc; border-radius: 8px; padding: 16px; margin-top: 16px; }
        .provider-card h2 { margin-top: 0; }
        .error { color: red; }
        #wind-alert { display: none; background: #d32f2f; color: white; padding: 12px 16px; border-radius: 6px; margin-top: 12px; }
        .graph-wrapper { display: flex; align-items: stretch; margin-top: 24px; }
        #var-buttons { display: flex; flex-direction: column; gap: 8px; justify-content: center; padding-right: 12px; }
        .var-btn { padding: 8px 12px; font-size: 14px; cursor: pointer; border: 1px solid #aaa; border-radius: 6px; background: #f5f5f5; white-space: nowrap; }
        .var-btn.active { background: #1a73e8; color: #fff; border-color: #1a73e8; }
        .graph-container { flex: 1; min-width: 0; }
    </style>
</head>
<body>
    <h1>WeatherApp</h1>

    <label for="address"></label><input id="address" type="text" placeholder="Indtast by fx. Odense" />
    <button onclick="fetchWeather()">Hent vejr</button>

    <div id="wind-alert"></div>
    <div id="results"></div>

    <div class="graph-wrapper">
        <div id="var-buttons"></div>
        <div class="graph-container">
            <canvas id="myChart"></canvas>
        </div>
    </div>

</body>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/ui/js/fetchWeather.js"></script>
<script src="/ui/js/graph.js"></script>

</html>
