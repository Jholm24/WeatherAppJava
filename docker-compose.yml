services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: WeatherApp
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: WeatherApp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
